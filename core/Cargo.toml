[workspace]
resolver = "2"
members = [
    "crates/urace-primitives",
    "crates/urace-crypto",
    "crates/urace-types",
    "crates/urace-ledger",
    "crates/urace-cost",
    "crates/urace-identity",
    "crates/urace-authority",
    "crates/urace-p2p",
    "crates/urace-executor",
    "crates/urace-settlement",
    "crates/urace-artifacts",
    "crates/urace-product",
    "crates/urace-qualification",
    "crates/urace-work",
    "crates/urace-goals",
    "crates/urace-net",
    "crates/urace-upgrade",
    "crates/urace-audit",
    "crates/urace",
    "crates/urace-tui",
    "crates/urace-schema",
    "crates/urace-mcp",
    "crates/urace-state",
    "crates/urace-web",
    "crates/urace-exchange",
]

[workspace.package]
version     = "0.1.0"
edition     = "2021"
license     = "Apache-2.0"
authors     = ["URACE Contributors"]
repository  = "https://github.com/urace/urace"

[workspace.dependencies]
# Sources
sources        = { git = "https://github.com/joaoalbertocsjunior/sources" }

# Serialization
serde          = { version = "1", features = ["derive"] }
serde_json     = { version = "1", features = ["float_roundtrip"] }
serde_yaml     = "0.9"

# Crypto (RustCrypto family — no ring)
hmac           = "0.12"
sha2           = "0.10"
aes-gcm        = "0.10"
ed25519-dalek  = { version = "2", features = ["rand_core"] }
rand           = "0.8"
rand_core      = "0.6"
getrandom      = "0.2"
zeroize        = { version = "1", features = ["derive"] }
hex            = "0.4"
hkdf           = "0.12"

# Error handling
thiserror      = "1"
anyhow         = "1"

# Async
tokio          = { version = "1", features = ["full"] }
async-trait    = "0.1"

# CLI
clap           = { version = "4", features = ["derive"] }

# Networking
reqwest        = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# P2P — BEP 5 DHT (mainline, not libp2p — protocol-compatible with Python peers)
mainline       = "2"

# (Lightning deps are in urace-settlement as optional, not workspace-level)

# Utilities
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time           = { version = "0.3", features = ["serde", "formatting"] }
uuid           = { version = "1", features = ["v4"] }
parking_lot    = "0.12"
dashmap        = "5"
regex-lite        = "0.1"
tempfile          = "3"
flate2            = "1"
libc              = "0.2"
sysinfo           = { version = "0.32", default-features = false, features = ["system", "disk"] }
petgraph          = "0.6"
axum-extra        = { version = "0.9", features = ["typed-header"] }
octocrab          = "0.41"
notify            = "6"
git2              = { version = "0.19", default-features = false }

# Web UI (urace-web)
axum           = { version = "0.7", features = ["json", "macros"] }
tower-http     = { version = "0.5", features = ["fs", "cors", "trace"] }
minijinja      = { version = "2", features = ["loader"] }
futures        = "0.3"
