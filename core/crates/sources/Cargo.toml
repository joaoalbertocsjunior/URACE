[package]
name        = "sources"
version     = "0.1.0"
edition     = "2021"
license     = "Apache-2.0"
authors     = ["URACE Contributors"]
description = "Source adapters, registry, M2M bridge, and HTTP control server"
repository  = "https://github.com/joaoalbertocsjunior/sources"

[dependencies]
axum          = { version = "0.7", features = ["json", "macros"] }
reqwest       = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
octocrab      = "0.41"
notify        = "6"
git2          = { version = "0.19", default-features = false }
tokio         = { version = "1", features = ["full"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
thiserror     = "1"
tracing       = "0.1"
async-trait   = "0.1"
uuid          = { version = "1", features = ["v4"] }
