{% extends "base.html" %}
{% block title_suffix %} — Exchange{% endblock %}

{% block content %}
<h1>Exchange</h1>

<div style="display:grid;grid-template-columns:1fr 2fr;gap:1.2rem;margin-bottom:1.5rem;" id="exchange-top">
  <div class="config-section">
    <h2 class="section-title">Peers</h2>
    <div id="peers-wrap">
      <div class="vitals-loading">Loading...</div>
    </div>
    <div style="margin-top:0.6rem;font-size:0.75rem;color:#64748b;">Peer IDs are anonymised SHA-256 hashes.</div>
  </div>

  <div class="config-section">
    <h2 class="section-title">Asset Search</h2>
    <div id="p2p-warning" style="display:none;margin-bottom:0.8rem;"></div>
    <div class="filter-bar">
      <input type="text" id="asset-query" class="field-input filter-text" placeholder="Search assets..." style="flex:1;">
      <button class="btn-primary" onclick="searchAssets()">Search</button>
    </div>
    <div id="assets-wrap">
      <div class="cycle-empty">Enter a query to search assets.</div>
    </div>
  </div>
</div>

<script>
const TOKEN = {{ token | tojson }};

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function loadPeers() {
  const wrap = document.getElementById('peers-wrap');
  try {
    const r = await fetch('/api/exchange/peers', {headers:{'Authorization':'Bearer '+TOKEN}});
    const data = await r.json();
    const count = data.peer_count ?? 0;
    if (count === 0) {
      wrap.innerHTML = `<div class="cycle-empty">P2P network not enabled.</div>`;
      document.getElementById('p2p-warning').style.display = '';
      document.getElementById('p2p-warning').innerHTML = `<div class="cycle-warning">P2P peer count is 0. Asset exchange may not be available. Check capability_flags in Config.</div>`;
      return;
    }
    const ids = (data.anonymized_peer_ids || []);
    wrap.innerHTML = `
      <div class="vitals-value" style="font-size:2rem;color:#818cf8;">${count}</div>
      <div style="color:#64748b;font-size:0.8rem;margin-top:0.3rem;">peer${count !== 1 ? 's' : ''} connected</div>
      ${ids.length ? `<div style="margin-top:0.6rem;">${ids.map(id => `<div class="mono-sm" style="margin-bottom:0.2rem;">${escHtml(id)}</div>`).join('')}</div>` : ''}
      ${data.error ? `<div class="shell-error" style="margin-top:0.4rem;">${escHtml(data.error)}</div>` : ''}`;
  } catch(err) {
    wrap.innerHTML = `<div class="shell-error">Failed to load peers: ${escHtml(err.message)}</div>`;
  }
}

async function checkCapabilityFlags() {
  try {
    const r = await fetch('/api/config/values', {headers:{'Authorization':'Bearer '+TOKEN}});
    const data = await r.json();
    const flags = data.capability_flags || {};
    const p2pEnabled = flags.p2p_mint || flags.p2p_sell || flags.p2p_borrow;
    if (p2pEnabled === false) {
      const warn = document.getElementById('p2p-warning');
      if (warn.style.display === 'none') {
        warn.style.display = '';
        warn.innerHTML = `<div class="cycle-warning">P2P capability flags (p2p_mint, p2p_sell, p2p_borrow) are disabled in Config. Asset exchange is restricted.</div>`;
      }
    }
  } catch(_) {}
}

async function searchAssets() {
  const query = document.getElementById('asset-query').value.trim();
  const wrap = document.getElementById('assets-wrap');
  wrap.innerHTML = '<div class="vitals-loading">Loading...</div>';
  try {
    let url = '/api/exchange/assets';
    if (query) url += '?query=' + encodeURIComponent(query);
    const r = await fetch(url, {headers:{'Authorization':'Bearer '+TOKEN}});
    const data = await r.json();
    if (data.error && !data.open_assets) {
      wrap.innerHTML = `<div class="shell-error">${escHtml(data.error)}</div>`;
      return;
    }
    const assets = data.open_assets || [];
    if (!assets.length) {
      wrap.innerHTML = '<div class="cycle-empty">No assets found.</div>';
      return;
    }
    const thead = `<tr><th>Feature ID</th><th>Description</th><th>Tags</th><th>Score</th></tr>`;
    const tbody = assets.map(a => `<tr class="exchange-result-row">
      <td class="mono-sm">${escHtml(a.feature_id||'—')}</td>
      <td class="reasoning-cell" title="${escHtml(a.description||'')}">
        ${escHtml((a.description||'').slice(0,80))}${(a.description||'').length > 80 ? '…' : ''}
      </td>
      <td style="font-size:0.78rem;color:#94a3b8;">${escHtml((a.tags||[]).join(', '))}</td>
      <td>${a.match_score != null ? Math.round(a.match_score * 100) + '%' : '—'}</td>
    </tr>`).join('');
    wrap.innerHTML = `<table class="audit-table"><thead>${thead}</thead><tbody>${tbody}</tbody></table>`;
  } catch(err) {
    wrap.innerHTML = `<div class="shell-error">Failed to search assets: ${escHtml(err.message)}</div>`;
  }
}

document.getElementById('asset-query').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') searchAssets();
});

loadPeers();
checkCapabilityFlags();
</script>
{% endblock %}
