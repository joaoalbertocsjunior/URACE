{% extends "base.html" %}
{% block title_suffix %} — Portfolio{% endblock %}

{% block content %}
<h1>Portfolio</h1>

<div id="portfolio-header" class="goals-add-card">
  <div class="vitals-loading">Loading portfolio status...</div>
</div>

<div id="last-error-alert" style="display:none;" class="warn-alert"></div>

<div class="goals-section" style="margin-top:1.5rem;">
  <div class="goals-list-header">
    <h2 class="section-title">Variants</h2>
    <button class="btn-secondary" onclick="loadPortfolio()">Refresh</button>
  </div>
  <div id="variants-table-wrap">
    <div class="vitals-loading">Loading...</div>
  </div>
</div>

<script>
const TOKEN = {{ token | tojson }};

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function variantStatusBadge(status) {
  const m = {
    'ACTIVE': 'badge-active',
    'WINNER': 'badge-active',
    'RETIRED': 'badge-default',
    'PENDING': 'badge-planned',
  };
  const cls = m[status] || 'badge-default';
  return `<span class="status-badge ${cls}">${escHtml(status)}</span>`;
}

function evidenceBar(units) {
  const pct = Math.min(100, (units / 10) * 100);
  return `<div class="evidence-bar"><div class="evidence-fill" style="width:${pct}%"></div></div>
    <span style="font-size:0.8rem;color:#94a3b8;margin-left:0.4rem;">${units}</span>`;
}

async function loadPortfolio() {
  const headerEl = document.getElementById('portfolio-header');
  const alertEl = document.getElementById('last-error-alert');
  const tableEl = document.getElementById('variants-table-wrap');

  try {
    const r = await fetch('/api/portfolio/feedback', {headers:{'Authorization':'Bearer '+TOKEN}});
    const data = await r.json();

    const phase = data.phase || 'UNKNOWN';
    const gen = data.generation ?? '—';
    const completed = data.completed_generations ?? '—';
    const worth = data.portfolio_worth || {};
    const decision = worth.decision || '—';
    const reasons = worth.reasons || [];

    headerEl.innerHTML = `
      <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;">
        <span class="portfolio-phase-badge">${escHtml(phase)}</span>
        <span style="color:#94a3b8;">Generation <strong style="color:#e2e8f0;">${escHtml(String(gen))}</strong></span>
        <span style="color:#94a3b8;">Completed <strong style="color:#e2e8f0;">${escHtml(String(completed))}</strong></span>
        <span style="color:#94a3b8;">Worth: <strong style="color:#e2e8f0;">${escHtml(decision)}</strong></span>
      </div>
      ${reasons.length ? `<ul style="margin-top:0.6rem;padding-left:1.2rem;color:#94a3b8;font-size:0.85rem;">${reasons.map(r2=>`<li>${escHtml(r2)}</li>`).join('')}</ul>` : ''}`;

    if (data.last_error) {
      alertEl.style.display = 'block';
      alertEl.textContent = 'Error: ' + data.last_error;
    } else {
      alertEl.style.display = 'none';
    }

    const variants = (data.variants || []).slice().sort((a, b) => {
      const av = a.metric_value ?? -Infinity;
      const bv = b.metric_value ?? -Infinity;
      return bv - av;
    });

    if (!variants.length) {
      tableEl.innerHTML = '<div class="cycle-empty">No variants.</div>';
      return;
    }

    const rows = variants.map(v => {
      const metric = v.metric_value != null ? Number(v.metric_value).toFixed(4) : '—';
      return `<tr class="variant-row">
        <td>${escHtml(v.name || '')}</td>
        <td>${variantStatusBadge(v.status || '')}</td>
        <td style="font-variant-numeric:tabular-nums;">${escHtml(metric)}</td>
        <td style="display:flex;align-items:center;">${evidenceBar(v.evidence_units ?? 0)}</td>
      </tr>`;
    }).join('');

    tableEl.innerHTML = `<table class="data-table">
      <thead><tr><th>Name</th><th>Status</th><th>Metric</th><th>Evidence</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
  } catch(err) {
    headerEl.innerHTML = `<div class="shell-error">Failed to load portfolio: ${escHtml(err.message)}</div>`;
    tableEl.innerHTML = '';
  }
}

loadPortfolio();
setInterval(loadPortfolio, 20000);
</script>
{% endblock %}
