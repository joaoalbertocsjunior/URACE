{% extends "base.html" %}
{% block title_suffix %} — Shell{% endblock %}

{% block content %}
<div class="shell-page">
  <div class="shell-page-header">
    <div>
      <h1 class="page-title" style="margin-bottom:0.1rem;">Shell</h1>
      <p class="page-subtitle">URACE commands (<code>/cmd</code>) or OS passthrough (<code>! cmd</code>)</p>
    </div>
    <div id="cycle-warning" class="banner banner-warn" style="display:none">
      Cycle active — commands may touch live state
    </div>
  </div>

  <div class="shell-container">
    <div id="output" class="shell-output">
      <div class="shell-welcome">Type <code>/help</code> to list all commands &nbsp;·&nbsp; <code>! ls</code> to run an OS command</div>
    </div>
    <div class="shell-input-wrap">
      <div id="autocomplete" class="autocomplete-dropdown" style="display:none"></div>
      <div class="shell-input-row">
        <span class="shell-prompt-glyph">›</span>
        <input type="text" id="shell-input" class="shell-input"
               placeholder="/status  ·  /goals list  ·  ! git log"
               autocomplete="off" autofocus>
        <button id="shell-submit" onclick="submitCommand()">Run</button>
      </div>
    </div>
  </div>
</div>

<script>

  { cmd: '/config show',              desc: 'Print full config' },
  { cmd: '/config get ',              desc: 'Get one key  <dotted.path>' },

  { cmd: '/config validate',          desc: 'Validate config against schema' },

  { cmd: '/source add',               desc: 'Register source  --kind KIND [--id ID] [--set k=v]' },
  { cmd: '/source remove ',           desc: 'Remove source  <id>' },
  { cmd: '/source sync ',             desc: 'Trigger immediate sync  <id>  (needs daemon)' },

  // ── work ──────────────────────────────────────────────────────────────────

  { cmd: '/audit',                    desc: 'Browse audit log  [decisions|evidence] [--since TS] [--limit N]' },
  { cmd: '/trace',                    desc: 'Lifecycle audit trace  [--kind CYCLE|OPERATION|DECISION] [--limit N]' },

  { cmd: '/goals list',               desc: 'List objectives  [--status STATUS] [--limit N]' },
  { cmd: '/goals add ',               desc: 'Create goal  <title>  (§62z stub)' },
  { cmd: '/goals pin',                desc: 'Pin goal  --id ID' },
  { cmd: '/goals unpin',              desc: 'Unpin goal  --id ID' },
  { cmd: '/goals defer',              desc: 'Defer goal  --id ID' },
  { cmd: '/goals cancel',             desc: 'Cancel goal  --id ID' },

  // ── data ──────────────────────────────────────────────────────────────────
  { cmd: '/data list',                desc: 'List data records  [--limit N]' },
  { cmd: '/data show',                desc: 'Show data record  --reference REF' },
  { cmd: '/data status',              desc: 'Summary of all data source statuses' },
  { cmd: '/data source',              desc: 'Manage sources  --source-action list|show|sync|add|remove [--name N] [--adapter-kind K] [--dsn URI] [--direction read|write|both]' },

  { cmd: '/report cycle',             desc: 'Generate cycle report' },
  { cmd: '/report audit',             desc: 'Generate audit report' },

  { cmd: '/exchange status',          desc: 'Exchange peer + feature count' },
  { cmd: '/exchange list',            desc: 'List feature atoms' },
  { cmd: '/exchange show ',           desc: 'Show feature atom  <atom_id>' },
  { cmd: '/exchange rank',            desc: 'Rank features by quality  [--limit N]' },
  { cmd: '/exchange reputation',      desc: 'Peer reputation summary' },
  { cmd: '/exchange ledger',          desc: 'Ledger run summary' },
  { cmd: '/exchange settle',          desc: 'Settlement status (EVM/Lightning stub)' },
  { cmd: '/exchange asset list',      desc: 'List asset registry' },
  { cmd: '/exchange asset show ',     desc: 'Show asset  <id>' },
  { cmd: '/exchange ask ',            desc: 'Place ask order  <atom_id> --price UCR  (§62z)' },
  { cmd: '/exchange fill ',           desc: 'Fill order  <order_id>  (§62z)' },
  { cmd: '/exchange cancel ',         desc: 'Cancel order  <order_id>' },
  { cmd: '/exchange momentum',        desc: 'Market momentum metrics' },

  { cmd: '/trial status',             desc: 'Show qualification trial status' },
  { cmd: '/trial run',                desc: 'Run qualification trial  (stub)' },

  { cmd: '/update apply',             desc: 'Apply runtime update  (stub)' },

  { cmd: '/features toggle ',         desc: 'Toggle feature flag  <flag>' },

  // ── product ───────────────────────────────────────────────────────────────
  { cmd: '/product list',             desc: 'List product registry' },
  { cmd: '/product show',             desc: 'Show product  --name NAME' },
  { cmd: '/product create',           desc: 'Create product  --name NAME  (§62z)' },
  { cmd: '/product activate',         desc: 'Activate product  --name NAME  (§62z)' },
  { cmd: '/product switch',           desc: 'Switch active product  --name NAME  (§62z)' },
  { cmd: '/product register',         desc: 'Register product  --name NAME  (§62z)' },
  { cmd: '/product status',           desc: 'Active product status' },
  { cmd: '/content list',             desc: 'List content store' },
  { cmd: '/content show',             desc: 'Show content item  --id ID' },
  { cmd: '/content add',              desc: 'Add content item  (stub)' },
  { cmd: '/rollback',                 desc: 'Rollback to snapshot  [--to SNAPSHOT]  (§62z)' },
  { cmd: '/peer-review list',         desc: 'List peer review requests' },
  { cmd: '/peer-review submit',       desc: 'Submit peer review  (stub)' },

  // ── OS passthrough examples ───────────────────────────────────────────────
  { cmd: '! ls',                      desc: 'List current directory (OS)' },
  { cmd: '! pwd',                     desc: 'Print working directory (OS)' },
  { cmd: '! git log --oneline -10',   desc: 'Recent git commits (OS)' },
  { cmd: '! git status',              desc: 'Git working tree status (OS)' },
  { cmd: '! cat ~/.urace/config.json',desc: 'Print config file (OS)' },
  { cmd: '! env | grep URACE',        desc: 'Show URACE env vars (OS)' },

// ── Autocomplete ───────────────────────────────────────────────────────────────
const inputEl = document.getElementById('shell-input');
const acEl    = document.getElementById('autocomplete');
let acIdx  = -1;
let acItems = [];

inputEl.addEventListener('input', onInput);
inputEl.addEventListener('keydown', onKeyDown);
document.addEventListener('click', e => {
  if (!acEl.contains(e.target) && e.target !== inputEl) hideAC();
});

function onInput() {
  const q = inputEl.value;
  const ql = q.toLowerCase();
  if (!q) { hideAC(); return; }

  acItems = COMMANDS.filter(c => {
    const cl = c.cmd.toLowerCase();
    return cl.startsWith(ql) || cl.includes(ql);
  }).slice(0, 10);

  if (!acItems.length) { hideAC(); return; }
  acIdx = -1;
  renderAC();
}

function renderAC() {
  acEl.innerHTML = '';
  acItems.forEach((item, i) => {
    const row = document.createElement('div');
    row.className = 'ac-item' + (i === acIdx ? ' ac-active' : '');
    const isOs = item.cmd.startsWith('!');
    const prefix = isOs
      ? '<span class="ac-prefix ac-prefix-os">!</span>'
      : '<span class="ac-prefix ac-prefix-urace">/</span>';
    const cmdDisplay = isOs ? item.cmd.slice(1).trim() : item.cmd.slice(1).trim();
    row.innerHTML = `${prefix}<span class="ac-cmd">${escHtml(cmdDisplay)}</span><span class="ac-desc">${escHtml(item.desc)}</span>`;
    row.addEventListener('mousedown', e => { e.preventDefault(); selectAC(i); });
    acEl.appendChild(row);
  });
  acEl.style.display = 'block';
}

function onKeyDown(e) {
  if (acEl.style.display === 'none') {
    if (e.key === 'Enter') submitCommand();
    return;
  }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    acIdx = Math.min(acIdx + 1, acItems.length - 1);
    renderAC();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    acIdx = Math.max(acIdx - 1, 0);
    renderAC();
  } else if (e.key === 'Tab' || e.key === 'Enter') {
    e.preventDefault();
    if (acIdx >= 0) selectAC(acIdx);
    else if (e.key === 'Enter') { hideAC(); submitCommand(); }
  } else if (e.key === 'Escape') {
    hideAC();
  }
}

function selectAC(i) {
  inputEl.value = acItems[i].cmd;
  hideAC();
  inputEl.focus();
}

function hideAC() {
  acEl.style.display = 'none';
  acItems = [];
  acIdx = -1;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Submit ─────────────────────────────────────────────────────────────────────
async function submitCommand() {
  hideAC();
  const input = inputEl.value.trim();
  if (!input) return;
  inputEl.value = '';

  const output = document.getElementById('output');
  const prompt = document.createElement('div');
  prompt.className = 'shell-prompt-line';
  prompt.textContent = '› ' + input;
  output.appendChild(prompt);
  output.scrollTop = output.scrollHeight;

  try {
    const resp = await fetch('/api/shell/run', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + TOKEN,
      },
      body: JSON.stringify({ input }),
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const data = line.slice(6);
          if (data === '[DONE]') break;
          const div = document.createElement('div');
          // ANSI red escape from stderr → style as error
          if (data.includes('\x1b[31m')) {
            div.className = 'shell-line shell-error';
            div.textContent = data.replace(/\x1b\[[0-9;]*m/g, '');
          } else {
            div.className = 'shell-line';
            div.textContent = data;
          }
          output.appendChild(div);
          output.scrollTop = output.scrollHeight;
        }
      }
    }
  } catch (err) {
    const div = document.createElement('div');
    div.className = 'shell-line shell-error';
    div.textContent = 'Error: ' + err.message;
    output.appendChild(div);
  }
  output.scrollTop = output.scrollHeight;
}

document.body.addEventListener('htmx:afterSwap', function(e) {
  if (e.detail.target && e.detail.target.id === 'daemon-bar') {
    const hasCycle = e.detail.target.querySelector('.cycle-badge') !== null;
    document.getElementById('cycle-warning').style.display = hasCycle ? 'flex' : 'none';
  }
});
</script>
{% endblock %}
