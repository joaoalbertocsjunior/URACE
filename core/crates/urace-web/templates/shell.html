{% extends "base.html" %}
{% block title_suffix %} — Shell{% endblock %}

{% block content %}
<div id="cycle-warning" class="cycle-warning" style="display:none">
  A cycle is currently active. Commands may interact with live state.
</div>
<div class="shell-container">
  <div id="output" class="shell-output"></div>
  <div class="shell-input-row">
    <input type="text" id="shell-input" class="shell-input" placeholder="Enter command or natural language..." autocomplete="off" autofocus>
    <button id="shell-submit" onclick="submitCommand()">Run</button>
  </div>
</div>

<script>
const TOKEN = {{ token | tojson }};

document.getElementById('shell-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') submitCommand();
});

async function submitCommand() {
  const inputEl = document.getElementById('shell-input');
  const input = inputEl.value.trim();
  if (!input) return;
  inputEl.value = '';

  const output = document.getElementById('output');
  const prompt = document.createElement('div');
  prompt.className = 'shell-prompt';
  prompt.textContent = '> ' + input;
  output.appendChild(prompt);
  output.scrollTop = output.scrollHeight;

  try {
    const resp = await fetch('/api/shell/run', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + TOKEN,
      },
      body: JSON.stringify({input}),
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += decoder.decode(value, {stream: true});
      const lines = buf.split('\n');
      buf = lines.pop();
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          const data = line.slice(6);
          if (data === '[DONE]') break;
          const div = document.createElement('div');
          div.className = 'shell-line';
          div.textContent = data;
          output.appendChild(div);
          output.scrollTop = output.scrollHeight;
        }
      }
    }
  } catch (err) {
    const div = document.createElement('div');
    div.className = 'shell-line shell-error';
    div.textContent = 'Error: ' + err.message;
    output.appendChild(div);
    output.scrollTop = output.scrollHeight;
  }
}

document.body.addEventListener('htmx:afterSwap', function(e) {
  if (e.detail.target.id === 'daemon-bar') {
    const hasCycleBadge = e.detail.target.querySelector('.cycle-badge') !== null;
    document.getElementById('cycle-warning').style.display = hasCycleBadge ? 'block' : 'none';
  }
});
</script>
{% endblock %}
