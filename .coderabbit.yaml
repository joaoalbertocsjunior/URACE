# CodeRabbit AI reviewer configuration — URACE Rust workspace
# https://docs.coderabbit.ai/getting-started/configure-coderabbit
version: "2"

reviews:
  auto_review:
    enabled: true
    drafts: false

  profile: "chill"

  instructions: |
    URACE is a governance-first P2P runtime written in Rust (workspace under `core/`).
    External source adapter library: `sources` crate (git dep, joaoalbertocsjunior/sources).

    Hard invariants — flag any violation:
    - §62z: no automated path takes a qualifying action (spend, transfer, goal creation)
      without routing through `urace-authority` and receiving AUTONOMOUSLY_AUTHORIZED.
      Outcomes: AUTONOMOUSLY_AUTHORIZED / DENIED / REQUIRES_AUTHORITATIVE_DECISION / UNRESOLVED.
      UNRESOLVED must be treated as DENIED.
    - Append-only ledger: rows in `*_journal*` / `*_ledger*` JSONL files are never deleted
      or mutated after write. All mutations via `atomic_append_jsonl` or `atomic_write_json`.
    - UNIT = 100_000_000u64 (10^8 UCR). Flag any change to this constant.
    - Mint only on `score_delta > 0`. Flag any mint path that does not check this.
    - Launcher exit codes: EXIT_REVALIDATE=75, EXIT_ONE_RETRY=76. Flag any change.
    - `except`-equivalent: `unwrap()` / `expect()` in production paths (not tests) for
      financial, signing, or authority flows must be replaced with surfaced errors.
    - No hardcoded secrets, tokens, or private key material.
    - No `.unwrap()` on lock acquisition in financial/signing paths — use `try_lock`.
    - Non-atomic read-modify-write sequences on shared state without a lock are bugs.

    Style:
    - Do not suggest adding comments that explain WHAT the code does.
    - Do not suggest multi-line doc comments; one short line max on `///`.
    - Do not suggest adding `#[allow(dead_code)]` to suppress unused warnings — fix the root cause.

  path_instructions:

    # Ledger / financial integrity
    - path: "core/crates/urace-ledger/**"
      instructions: |
        Append-only invariant: no row may be deleted or mutated after write.
        Every write must use `atomic_append_jsonl` or `atomic_write_json`.
        Flag any path that calls `std::fs::write` / `File::create` directly on a journal file.
        HMAC chain: every row must carry a valid HMAC-SHA256 computed over the canonical JSON.
        `seq` must be monotonically increasing. Flag any branch where seq can go backwards.
        Constant-time comparison: HMAC verification must use `mac.verify_slice()` (from
        the hmac crate), never `==`. Flag manual byte-by-byte or string comparisons of MACs.
        Double-spend: all debit paths must check balance before deducting.
        UNIT = 100_000_000u64 — flag any arithmetic that could overflow this without
        using `checked_add` / `checked_mul` / `saturating_*`.

    - path: "core/crates/urace-ledger/src/journal.rs"
      instructions: |
        Symlink rejection: `path.is_symlink()` must be checked before opening.
        No silent failure: errors from `atomic_append_jsonl` must surface to the caller.
        Seq derivation: count of non-empty lines must match the logical sequence counter.

    # Authority boundary
    - path: "core/crates/urace-authority/**"
      instructions: |
        §62z invariant: every public function that can produce AUTONOMOUSLY_AUTHORIZED
        must document the qualifying conditions. Flag any shortcut that returns
        AUTONOMOUSLY_AUTHORIZED without evaluating all conditions.
        Capability escalation: every authority decision must emit an audit event via
        urace-audit. Flag any branch that decides without auditing.
        Reserved phrases: `override authority`, `bypass authority`, `ignore authority`
        appearing in string literals or comments must be reviewed — they may indicate
        an attempt to document a bypass.

    # Cryptography / signing
    - path: "core/crates/urace-crypto/**"
      instructions: |
        Private key material must never appear in tracing spans, error messages, or
        return values other than the designated sign/export calls.
        Flag `zeroize` being removed from key-holding types.
        Ed25519 signing: use `ed25519-dalek` from the workspace. Flag use of deprecated
        or non-workspace crypto crates.
        Key derivation: flag use of non-cryptographic hash functions (e.g. FNV, xxHash)
        for deriving key material.

    - path: "core/crates/urace-p2p/src/peer_exchange.rs"
      instructions: |
        SealVoteResponse must carry a real Ed25519 signature when a signing key is
        available. Flag any regression to `String::new()` stub without a code comment
        explaining why the key is unavailable.
        Signature verification at the receiver: flag any path that accepts a
        SealVoteResponse without verifying the signature against the peer's known
        verifying key.

    # P2P / network trust
    - path: "core/crates/urace-p2p/**"
      instructions: |
        Peer admission safety: untrusted peers must pass `AdmissionGate::is_admitted`
        before being added to the routing table. Flag any shortcut that bypasses this.
        Kademlia Sybil resistance: flag bucket-filling where a single IP occupies
        multiple slots. Node IDs must be derived from public keys, not self-reported.
        Cartel guard: quorum checks must require a strict supermajority (> 2/3).
        Flag any quorum threshold that is configurable at runtime without an authority check.
        Relay-only mode: when `relay_only=true` the node's real IP must not appear in
        outgoing peer exchange messages.

    # Execution safety
    - path: "core/crates/urace-executor/**"
      instructions: |
        Sandbox boundary: every code execution path must route through `SandboxBackend`.
        Flag any direct `std::process::Command` that bypasses the backend trait.
        Resource limits (CPU, memory, time) must be present and not user-overridable
        without an authority check.
        Credential isolation: `env_clear()` must be called before executing user code.
        Flag any path that inherits the parent process environment.
        `StubBackend` is intentional for testing — do not suggest removing it, but
        flag if it is used in a non-test code path.

    # Settlement stubs
    - path: "core/crates/urace-settlement/**"
      instructions: |
        `submit_live()` and `pay_live()` are intentional stubs pending EVM/Lightning
        integration. Do not suggest removing them. Flag any attempt to call them in
        production paths without a feature flag guard.
        ABI encoding for EVM: flag address parameters that are not checksummed (EIP-55).
        Gas limits must not be user-controlled without bounds.

    # MCP server
    - path: "core/crates/urace-mcp/**"
      instructions: |
        §62z gate: mutating tools (post_work_task, sync_source, and any future tool
        that initiates spend/transfer/goal-creation) must be gated through
        urace-authority before execution. Flag any new tool that skips this.
        Input validation: all tool parameter parsing must surface errors as
        JSON-RPC error responses, never panic.

    # Upgrade / launcher
    - path: "core/crates/urace-upgrade/**"
      instructions: |
        EXIT_REVALIDATE=75 and EXIT_ONE_RETRY=76 are protocol constants. Flag any
        change to these values. Flag any path that bypasses the validation step
        (e.g., direct file swap without calling the validator).

    # Token economics
    - path: "core/crates/urace-goals/**"
      instructions: |
        Mint gating: `score_delta > 0` must be checked before minting. Flag any path
        where a mint can be triggered with `score_delta == 0` or negative.
        Goal creation is a qualifying action under §62z — flag any automated creation
        path that does not go through authority.

    # Sources / sources-lib integration
    - path: "core/crates/urace/src/runtime_loop.rs"
      instructions: |
        Every source sync cycle must emit an `AuditEvent::SourceSynced` entry.
        Work dispatch must check authority before bidding. Flag any work bid that
        bypasses the authority gate.
        Circuit breaker: 5 failures → Open. Flag any path that ignores the breaker
        state and dispatches work while Open.

    # Web UI
    - path: "core/crates/urace-web/**"
      instructions: |
        Bearer token: every `/api/*` handler must include `_auth: BearerToken` as a
        parameter. Flag any API route that skips the extractor.
        Page routes intentionally skip auth (token is embedded in HTML via template).
        SSE routes: flag any `futures::stream` usage that could block the async executor.
        Template errors must not panic — `get_template()` / `render()` failures must
        return a graceful HTML error response, not an `unwrap()` panic.
        `ServeDir` serves the CSS from `static/` — flag any path traversal risk
        (tower-http's ServeDir already mitigates this, but flag manual path joins on user input).

    # CI / workflow integrity
    - path: ".github/workflows/*.yml"
      instructions: |
        Supply chain: flag third-party actions not pinned to a full commit SHA
        (e.g. `uses: foo/bar@v1` should be `uses: foo/bar@<sha>`).
        Secrets: flag any step that could echo secrets to the build log.
        `pull_request_target` combined with checkout of the PR head is a classic
        script injection vector — flag it.
        Invariant checks: the `invariants` job must keep all four grep assertions
        (UNIT=100_000_000, score_delta>0, EXIT_REVALIDATE=75, EXIT_ONE_RETRY=76).
        Flag any PR that removes or weakens one of them.

    # Tests
    - path: "core/crates/*/tests/**"
      instructions: |
        Security-critical tests (ledger integrity, authority boundary, signing) must
        not mock the system under test. Flag tests that stub out the HMAC or signing
        path in a way that would let a broken implementation pass.
        Flag missing negative / adversarial cases for any security-sensitive function
        added or modified in the same PR.

  finishing_touches:
    docstrings:
      enabled: false

chat:
  auto_reply: true
