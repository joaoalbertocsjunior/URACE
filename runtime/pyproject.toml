[project]
name = "urace"
version = "0.9.3"
description = "Persistent autonomous Product-evolution control plane"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50,<51",
    "zeroconf>=0.148,<1",
    "kademlia>=2.2,<3",
    "miniupnpc>=2.2,<3",
    "litellm>=1.40",
    "pydantic>=2.0",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Operating System :: OS Independent",
    "Environment :: Console",
]

[project.optional-dependencies]
evm       = ["pysha3>=1.0,<2; python_version < '3.13'", "eth-account>=0.10"]
report    = ["openpyxl"]
media     = ["Pillow"]
telemetry = ["opentelemetry-sdk>=1.20", "opentelemetry-exporter-otlp-proto-grpc>=1.20"]
web       = ["fastapi>=0.110,<1", "uvicorn[standard]>=0.29,<1", "jinja2>=3.1,<4", "python-multipart>=0.0.9"]
github    = ["ghapi>=1.0"]
p2p       = ["httpx>=0.27"]
scheduling = ["APScheduler>=3.10"]
test      = ["pytest>=8", "pytest-xdist>=3", "pytest-testmon>=2", "pytest-cov>=5", "pytest-timeout>=2"]
# source adapter optional deps — all Apache 2.0 / MIT / BSD-3-Clause compatible
sources-git      = ["gitpython>=3.1"]
sources-s3       = ["boto3>=1.26"]
sources-kafka    = ["kafka-python>=2.0"]
sources-redis    = ["redis>=5.0"]
sources-mcp      = ["mcp>=1.0"]
sources-watch    = ["watchdog>=4.0"]
sources-full     = ["urace[sources-git,sources-s3,sources-kafka,sources-redis,sources-mcp,sources-watch,p2p]"]
all       = ["urace[evm,report,media,telemetry,web,github,p2p,scheduling,sources-full]"]

[project.scripts]
urace = "urace.launcher:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["urace", "urace.cli", "urace.web", "urace.web.routes"]

[tool.setuptools.package-data]
urace = ["config.json"]
"urace.web" = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--timeout=600 -m 'not slow and not integration'"
markers = [
    "slow: tests using subprocess, real git, or real file I/O",
    "integration: tests that require live network/DHT/mDNS",
    "timeout: override per-test timeout",
]

[tool.ruff.lint]
select = ["F", "E7", "B", "W"]
ignore = ["E501", "E402", "E731", "E701", "E702", "F401", "B008", "B904", "E741", "B007"]

[tool.coverage.run]
source = ["urace"]
omit = ["*/tests/*", "*/trial/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true
