[project]
name = "urace"
version = "0.1.0"
description = "Persistent autonomous Product-evolution control plane"
requires-python = ">=3.11"
dependencies = ["cryptography>=50,<51"]

[project.optional-dependencies]
peer-security = ["cryptography>=50,<51"]
peer-discovery = ["zeroconf>=0.148,<1"]

[project.scripts]
urace = "urace.launcher:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["urace"]
