{% extends "base.html" %}
{% block title_suffix %} — Sources{% endblock %}

{% block content %}
<h1>Sources</h1>

<div id="sources-controls" style="margin-bottom:1rem">
  <label for="kind-filter">Filter by kind:</label>
  <select id="kind-filter" onchange="loadSources()">
    <option value="">All</option>
  </select>
  <span id="allow-act-badge" style="margin-left:1.5rem;padding:0.2rem 0.6rem;border-radius:4px;font-size:0.85rem"></span>
</div>

<div id="sources-content">
  <div class="vitals-loading">Loading...</div>
</div>

<script>
const TOKEN = window.__URACE_TOKEN__;
const headers = { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' };

async function loadKinds() {
  try {
    const r = await fetch('/api/sources/kinds', { headers });
    const d = await r.json();
    const sel = document.getElementById('kind-filter');
    (d.kinds || []).forEach(k => {
      const opt = document.createElement('option');
      opt.value = k; opt.textContent = k;
      sel.appendChild(opt);
    });
  } catch (_) {}
}

async function loadSources() {
  const kind = document.getElementById('kind-filter').value;
  const url = '/api/sources/' + (kind ? '?kind=' + encodeURIComponent(kind) : '');
  try {
    const r = await fetch(url, { headers });
    const d = await r.json();
    renderSources(d);
  } catch (err) {
    document.getElementById('sources-content').innerHTML =
      `<div class="shell-error">Failed to load sources: ${err.message}</div>`;
  }
}

function statusClass(s) {
  return { CONFIGURED:'unknown', AVAILABLE:'unknown', OBSERVED:'active', ACTED:'active',
           AUTHENTICATED:'active', AUTHORIZED:'active' }[s] || 'unknown';
}

function renderSources(data) {
  const badge = document.getElementById('allow-act-badge');
  const allowAct = data.allow_act_global;
  if (allowAct !== undefined) {
    badge.textContent = allowAct ? 'act: ENABLED' : 'act: DISABLED';
    badge.style.background = allowAct ? '#2a7' : '#a44';
    badge.style.color = '#fff';
  }

  const adapters = data.adapters || [];
  if (!adapters.length) {
    document.getElementById('sources-content').innerHTML = '<p>No adapters registered.</p>';
    return;
  }

  let html = '';
  for (const a of adapters) {
    const instances = a.instances || [];
    html += `<div class="vitals-card" style="margin-bottom:1rem">
      <div class="vitals-title" style="font-size:1rem">${a.kind}
        <span style="font-size:0.8rem;color:#888;margin-left:0.5rem">${a.instance_count} instance(s)</span>
      </div>`;
    if (!instances.length) {
      html += `<div style="color:#888;font-size:0.85rem">No instances registered. Use <code>urace source add --kind ${a.kind} --name &lt;id&gt;</code></div>`;
    } else {
      for (const inst of instances) {
        html += `<div style="border:1px solid #333;border-radius:4px;padding:0.6rem;margin-top:0.5rem">
          <div>
            <strong>${inst.id}</strong>
            <span class="lifecycle-badge ${statusClass(inst.status)}" style="font-size:0.75rem;margin-left:0.5rem">${inst.status || '?'}</span>
            <span style="font-size:0.8rem;color:#888;margin-left:0.5rem">${inst.enabled ? 'enabled' : 'disabled'}</span>
          </div>
          <div id="actions-${inst.id}" style="margin-top:0.4rem">`;
        const actions = inst.enabled_actions || [];
        if (actions.length) {
          html += `<span style="font-size:0.8rem;color:#aaa">Enabled actions: </span>`;
          for (const act of actions) {
            html += `<span style="background:#222;padding:0.1rem 0.4rem;border-radius:3px;font-size:0.8rem;margin-right:0.3rem">${act}
              <button onclick="disableAction('${inst.id}','${act}')" style="background:none;border:none;color:#a44;cursor:pointer;font-size:0.75rem">✕</button>
            </span>`;
          }
        } else {
          html += `<span style="font-size:0.8rem;color:#666">No enabled actions.</span>`;
        }
        html += `</div>
          <div style="margin-top:0.5rem;display:flex;gap:0.5rem;flex-wrap:wrap">
            <input id="new-action-${inst.id}" placeholder="action name" style="padding:0.2rem 0.4rem;font-size:0.8rem;width:12rem">
            <button onclick="enableAction('${inst.id}')" style="font-size:0.8rem;padding:0.2rem 0.6rem">Enable action</button>
            <button onclick="actOn('${inst.id}')" style="font-size:0.8rem;padding:0.2rem 0.6rem">Act</button>
            <input id="payload-${inst.id}" placeholder='payload JSON e.g. {"key":"val"}' style="padding:0.2rem 0.4rem;font-size:0.8rem;width:18rem">
          </div>
          <div id="result-${inst.id}" style="font-size:0.8rem;color:#aaa;margin-top:0.3rem"></div>
        </div>`;
      }
    }
    html += '</div>';
  }
  document.getElementById('sources-content').innerHTML = html;
}

async function enableAction(sourceId) {
  const action = document.getElementById('new-action-' + sourceId).value.trim();
  if (!action) return;
  const r = await fetch(`/api/sources/${encodeURIComponent(sourceId)}/actions/${encodeURIComponent(action)}/enable`, { method: 'POST', headers });
  const d = await r.json();
  document.getElementById('result-' + sourceId).textContent = r.ok ? `Enabled: ${action}` : JSON.stringify(d);
  if (r.ok) loadSources();
}

async function disableAction(sourceId, action) {
  const r = await fetch(`/api/sources/${encodeURIComponent(sourceId)}/actions/${encodeURIComponent(action)}/enable`, { method: 'DELETE', headers });
  const d = await r.json();
  document.getElementById('result-' + sourceId).textContent = r.ok ? `Disabled: ${action}` : JSON.stringify(d);
  if (r.ok) loadSources();
}

async function actOn(sourceId) {
  const actionInput = document.getElementById('new-action-' + sourceId).value.trim();
  const payloadRaw = document.getElementById('payload-' + sourceId).value.trim();
  let payload = {};
  if (payloadRaw) { try { payload = JSON.parse(payloadRaw); } catch { alert('Invalid JSON payload'); return; } }
  const r = await fetch(`/api/sources/${encodeURIComponent(sourceId)}/act`, {
    method: 'POST', headers,
    body: JSON.stringify({ action: actionInput, payload }),
  });
  const d = await r.json();
  document.getElementById('result-' + sourceId).textContent = JSON.stringify(d, null, 2);
}

// Enrich list response with allow_act_global from actions endpoint
async function loadSourcesWithActStatus() {
  const kind = document.getElementById('kind-filter').value;
  const url = '/api/sources/' + (kind ? '?kind=' + encodeURIComponent(kind) : '');
  try {
    const [r1] = await Promise.all([fetch(url, { headers })]);
    const d = await r1.json();
    // Fetch allow_act_global from first instance actions if any
    const firstInst = (d.adapters || []).flatMap(a => a.instances || [])[0];
    if (firstInst) {
      const r2 = await fetch(`/api/sources/${encodeURIComponent(firstInst.id)}/actions`, { headers });
      if (r2.ok) { const d2 = await r2.json(); d.allow_act_global = d2.allow_act_global; }
    }
    renderSources(d);
  } catch (err) {
    document.getElementById('sources-content').innerHTML =
      `<div class="shell-error">Failed to load sources: ${err.message}</div>`;
  }
}

loadKinds();
loadSourcesWithActStatus();
setInterval(loadSourcesWithActStatus, 15000);
</script>
{% endblock %}
