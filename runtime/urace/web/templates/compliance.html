{% extends "base.html" %}
{% block title_suffix %} — Compliance{% endblock %}

{% block content %}
<div class="audit-header">
  <h1>Compliance</h1>
  <div style="display:flex;gap:0.5rem;align-items:center;">
    <select id="domain-filter" class="filter-select" onchange="filterDomain()">
      <option value="">All domains</option>
      <option value="authority">authority</option>
      <option value="intent">intent</option>
      <option value="schema">schema</option>
      <option value="constraint">constraint</option>
      <option value="governance">governance</option>
    </select>
    <button class="btn-secondary" onclick="loadCompliance()">Refresh</button>
  </div>
</div>

<div id="domain-cards" class="compliance-grid">
  <div class="vitals-loading">Loading...</div>
</div>

<div style="margin-top:1.5rem;">
  <h2 class="section-title">Recent Records</h2>
  <div id="records-table-wrap">
    <div class="vitals-loading">Loading...</div>
  </div>
</div>

<script>
const TOKEN = {{ token | tojson }};

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function statusClass(s) {
  if (s === 'COMPLIANT') return 'badge-active';
  if (s === 'NON_COMPLIANT') return 'badge-danger';
  return 'badge-default';
}

function statusDotClass(s) {
  if (s === 'COMPLIANT') return 'compliant';
  if (s === 'NON_COMPLIANT') return 'non-compliant';
  return 'unknown';
}

function renderCards(domains) {
  const wrap = document.getElementById('domain-cards');
  if (!domains || !domains.length) {
    wrap.innerHTML = '<div class="cycle-empty">No domain data available.</div>';
    return;
  }
  wrap.innerHTML = domains.map(d => `
    <div class="domain-card">
      <div class="domain-card-header">
        <span class="domain-status-dot ${statusDotClass(d.status)}"></span>
        <span class="domain-name">${escHtml(d.domain || '—')}</span>
      </div>
      <div class="domain-card-body">
        <span class="status-badge ${statusClass(d.status)}">${escHtml(d.status || 'UNKNOWN')}</span>
        <div class="domain-clean-count">${escHtml(String(d.consecutive_clean ?? 0))} clean</div>
        ${d.last_checked_at ? `<div class="domain-ts">${escHtml(d.last_checked_at.slice(0,16).replace('T',' '))}</div>` : ''}
        ${d.violation_refs && d.violation_refs.length ? `<div class="domain-violations">${d.violation_refs.length} violation${d.violation_refs.length !== 1 ? 's' : ''}</div>` : ''}
      </div>
    </div>
  `).join('');
}

function renderRecords(records) {
  const wrap = document.getElementById('records-table-wrap');
  if (!records || !records.length) {
    wrap.innerHTML = '<div class="cycle-empty">No recent records.</div>';
    return;
  }
  const thead = `<tr><th>ID</th><th>Domain</th><th>Status</th><th>Evaluated At</th><th>Violation Detail</th></tr>`;
  const tbody = records.map(r => `<tr>
    <td class="mono-sm" title="${escHtml(r.id||'')}">${escHtml((r.id||'').slice(0,8))}</td>
    <td>${escHtml(r.domain||'—')}</td>
    <td><span class="status-badge ${statusClass(r.status)}">${escHtml(r.status||'—')}</span></td>
    <td class="mono-sm">${escHtml((r.evaluated_at||'').slice(0,16).replace('T',' '))}</td>
    <td class="reasoning-cell" title="${escHtml(r.violation_detail||'')}">
      ${r.violation_detail ? escHtml(r.violation_detail.slice(0,80)) + (r.violation_detail.length > 80 ? '…' : '') : '<span style="color:#2d3148">—</span>'}
    </td>
  </tr>`).join('');
  wrap.innerHTML = `<table class="audit-table"><thead>${thead}</thead><tbody>${tbody}</tbody></table>`;
}

async function loadCompliance(url) {
  url = url || '/api/compliance/';
  document.getElementById('domain-cards').innerHTML = '<div class="vitals-loading">Loading...</div>';
  document.getElementById('records-table-wrap').innerHTML = '<div class="vitals-loading">Loading...</div>';
  try {
    const r = await fetch(url, {headers:{'Authorization':'Bearer '+TOKEN}});
    const data = await r.json();
    if (data.error && !data.domains) {
      document.getElementById('domain-cards').innerHTML = `<div class="shell-error">${escHtml(data.error)}</div>`;
      document.getElementById('records-table-wrap').innerHTML = '';
      return;
    }
    renderCards(data.domains || []);
    renderRecords(data.recent_records || []);
  } catch(err) {
    document.getElementById('domain-cards').innerHTML = `<div class="shell-error">Failed to load: ${escHtml(err.message)}</div>`;
    document.getElementById('records-table-wrap').innerHTML = '';
  }
}

function filterDomain() {
  const domain = document.getElementById('domain-filter').value;
  if (domain) {
    loadCompliance('/api/compliance/domain/' + encodeURIComponent(domain));
  } else {
    loadCompliance('/api/compliance/');
  }
}

loadCompliance();
</script>
{% endblock %}
