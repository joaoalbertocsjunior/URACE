<span class="status-dot {{ 'running' if status == 'running' else 'stopped' }}"></span>
{{ status }}
{% if status == 'running' %}
  {% if cycle_active %}
    <span class="cycle-badge">cycle active</span>
    <button hx-post="/api/daemon/stop" hx-confirm="A cycle is in progress — stopping now will interrupt it. Continue?" hx-target="#daemon-bar" hx-swap="innerHTML">Stop</button>
  {% else %}
    <button hx-post="/api/daemon/stop" hx-target="#daemon-bar" hx-swap="innerHTML">Stop</button>
  {% endif %}
{% else %}
  <button hx-post="/api/daemon/start" hx-target="#daemon-bar" hx-swap="innerHTML">Start</button>
{% endif %}
