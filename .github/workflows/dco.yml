name: DCO

on:
  pull_request:
    branches: [main]

jobs:
  dco:
    name: DCO Sign-off Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check DCO sign-off
        uses: christophebedard/dco-check@0.5.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
