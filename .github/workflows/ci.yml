name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          path: urace
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e "urace/runtime/[test]"
      - run: python -m pytest urace/runtime/tests/ -m "not slow" -x -q --timeout=600 --tb=short
      - run: python -m pytest urace/runtime/tests/ -m "slow" -x -q --timeout=600 --tb=short
      - run: PYTHONPATH=urace/runtime:urace/trial python -m pytest urace/trial/ --ignore=urace/trial/tests -m "not slow" -x -q --timeout=600 --tb=short

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: urace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e "urace/runtime/[test]"
      - run: python -m pytest urace/runtime/tests/ -m "not slow" -x -q --timeout=600 --tb=short --cov=urace --cov-report=term-missing --cov-fail-under=60

  benchmarks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: urace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e "urace/runtime/[test]"
      - run: PYTHONPATH=urace/runtime:urace/trial python -m pytest urace/trial/tests/ -x -q --timeout=600 --tb=short

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: urace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check urace/runtime/urace/ --select F,E7,B,W --ignore E501,E402,E731,E701,E702,F401,B008,B904,E741,B007

  ledger-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: urace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python runtime/build_initial_ledger.py
        working-directory: urace
      - run: git diff --exit-code exchange/initial_ledger/initial_ledger.jsonl
        working-directory: urace

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: urace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e "urace/runtime/" pip-audit
      - run: python -c "import urace; from urace.cli import main; print('import ok')"
      - run: python -c "from urace.credit_ledger import CONSENSUS_WEIGHTS, UNIT; assert UNIT == 100_000_000"
      - run: python -c "from urace.cost_model import BorrowCostContext, _ceiling_for_loc; assert _ceiling_for_loc(25)==0.05"
      - run: pip-audit --desc on urace/runtime/ || true
