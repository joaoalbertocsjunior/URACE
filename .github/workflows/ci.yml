name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-311:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e "runtime/[peer-security,peer-discovery,test]"
      - run: python -m pytest runtime/tests/ -x -q

  test-312:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e "runtime/[peer-security,peer-discovery,test]"
      - run: python -m pytest runtime/tests/ -x -q

  test-313:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e "runtime/[peer-security,peer-discovery,test]"
      - run: python -m pytest runtime/tests/ -x -q

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check runtime/urace/ --select E,F,W --ignore E501

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e "runtime/[peer-security,peer-discovery]"
      - run: urace init --product-name ci-audit-product --product-type generic --authority CI
      - run: urace security audit --no-network --json
