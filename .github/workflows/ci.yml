name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path core/Cargo.toml --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo clippy --manifest-path core/Cargo.toml --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Run tests
        run: cargo test --manifest-path core/Cargo.toml --workspace
      - name: Run doc tests
        run: cargo test --manifest-path core/Cargo.toml --workspace --doc

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit --manifest-path core/Cargo.toml

  invariants:
    name: Invariant checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # §62z — authority tests pass
      - name: Authority outcomes
        run: cargo test --manifest-path core/Cargo.toml -p urace-authority
      # Ledger — UNIT constant is exactly 100_000_000
      - name: UNIT constant
        run: grep -r "UNIT.*100_000_000\|100_000_000.*UNIT" core/crates/urace-ledger/src/
      # Mint gating — score_delta > 0 only
      - name: Mint-only-on-positive-delta
        run: grep -r "score_delta > 0\|should_mint" core/crates/urace-goals/src/ core/crates/urace-ledger/src/
      # Exit codes preserved
      - name: Launcher exit codes
        run: grep -r "EXIT_REVALIDATE.*75\|EXIT_ONE_RETRY.*76" core/crates/urace-upgrade/src/
