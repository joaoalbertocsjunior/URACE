name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-311:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: urace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e "urace/runtime/[peer-security,peer-discovery,test]"
      - run: python -m pytest urace/runtime/tests/ -x -q
      - run: PYTHONPATH=urace/runtime:urace/trial python -m pytest urace/trial/test_p2p_pair_protocol.py urace/trial/test_p2p_cost_claim_review.py -x -q

  test-312:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: urace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e "urace/runtime/[peer-security,peer-discovery,test]"
      - run: python -m pytest urace/runtime/tests/ -x -q
      - run: PYTHONPATH=urace/runtime:urace/trial python -m pytest urace/trial/test_p2p_pair_protocol.py urace/trial/test_p2p_cost_claim_review.py -x -q

  test-313:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: urace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e "urace/runtime/[peer-security,peer-discovery,test]"
      - run: python -m pytest urace/runtime/tests/ -x -q
      - run: PYTHONPATH=urace/runtime:urace/trial python -m pytest urace/trial/test_p2p_pair_protocol.py urace/trial/test_p2p_cost_claim_review.py -x -q

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: urace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check urace/runtime/urace/ --select F821,F541,F811

  ledger-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: urace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python urace/runtime/build_initial_ledger.py
      - run: git diff --exit-code urace/exchange/initial_ledger/initial_ledger.jsonl

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: urace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e "urace/runtime/[peer-security,peer-discovery]"
      - run: python urace/runtime/tests/conftest.py
      - run: urace security audit --no-network --json
