name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-311:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: urace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e "urace/runtime/[test]"
      - run: python -m pytest urace/runtime/tests/ -n auto -m "not slow" -x -q
      - run: python -m pytest urace/runtime/tests/ -m "slow" -x -q
      - run: PYTHONPATH=urace/runtime:urace/trial python -m pytest urace/trial/ --ignore=urace/trial/tests -m "not slow" -x -q

  test-312:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: urace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e "urace/runtime/[test]"
      - run: python -m pytest urace/runtime/tests/ -n auto -m "not slow" -x -q --cov=urace --cov-report=term-missing
      - run: python -m pytest urace/runtime/tests/ -m "slow" -x -q
      - run: PYTHONPATH=urace/runtime:urace/trial python -m pytest urace/trial/ --ignore=urace/trial/tests -m "not slow" -x -q

  test-313:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: urace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -e "urace/runtime/[test]"
      - run: python -m pytest urace/runtime/tests/ -n auto -m "not slow" -x -q
      - run: python -m pytest urace/runtime/tests/ -m "slow" -x -q
      - run: PYTHONPATH=urace/runtime:urace/trial python -m pytest urace/trial/ --ignore=urace/trial/tests -m "not slow" -x -q

  test-network-extras:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: urace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e "urace/runtime/[test]"
      - run: python -m pytest urace/runtime/tests/test_kademlia.py -x -q

  test-benchmarks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: urace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e "urace/runtime/[test]"
      - run: PYTHONPATH=urace/runtime:urace/trial python -m pytest urace/trial/tests/ -x -q

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: urace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check urace/runtime/urace/ --select F,E7,B,W --ignore E501,E402,E731,E701,E702,F401,B008,B904,E741,B007

  ledger-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: urace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python runtime/build_initial_ledger.py
        working-directory: urace
      - run: git diff --exit-code exchange/initial_ledger/initial_ledger.jsonl
        working-directory: urace

  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: urace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e "urace/runtime/"
      - run: python -c "import urace; from urace.cli import main; print('import ok')"
      - run: python -c "from urace.credit_ledger import CONSENSUS_WEIGHTS, UNIT; assert UNIT == 100_000_000"
      - run: python -c "from urace.cost_model import BorrowCostContext, _ceiling_for_loc; assert _ceiling_for_loc(25)==0.05"
