name: "URACE CodeQL Config"

paths-ignore:
  - core/target/

query-filters:
  - exclude:
      severity: note
  # BEP 5 DHT requires binding 0.0.0.0 — not a vulnerability in this context
  - exclude:
      id: rust/bind-socket-all-network-interfaces
  # Intentional: executor deliberately echoes user code for stub output
  - exclude:
      id: rust/unsafe-deserialization
